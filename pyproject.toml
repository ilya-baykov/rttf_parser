[project]
name = "rttf-parser"
version = "0.1.0"
description = "Async RTTF player profile parser"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "mypy>=1.10.0"]

[project.scripts]
rttf-parser = "rttf_parser.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
